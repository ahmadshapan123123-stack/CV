<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Shapan | Professional Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="p-0 md:p-4">
    <div
        class="max-w-5xl mx-auto bg-white shadow-2xl flex flex-col md:flex-row min-h-[1100px] rounded-xl overflow-hidden shadow-blue-200/50">
        <!-- Sidebar -->
        <div class="w-full md:w-1/3 sidebar-bg text-white p-8 flex flex-col">
            <div class="flex flex-col items-center mb-10 animate__animated animate__fadeIn relative">
                <div
                    class="w-32 h-32 rounded-3xl border-4 border-white/20 overflow-hidden mb-6 shadow-xl bg-white/10 flex items-center justify-center profile-img-container">
                    <img id="profile-img-src" src="assets/profile.jpg" alt="Ahmad Shapan"
                        class="w-full h-full object-cover">
                </div>
                <!-- Name (from data.js but defaulting for layout) -->
                <h1 id="user-name" class="text-2xl font-extrabold text-center tracking-tight uppercase text-white">AHMAD
                    SHAPAN</h1>
                <div class="h-1 w-12 bg-blue-400 mt-4 rounded-full"></div>
                <div class="edit-trigger" style="right: 10px; top: 10px;" onclick="openSectionEditor('personalInfo')"><i
                        class="fas fa-pen"></i></div>
            </div>

            <!-- Contact Info -->
            <div class="space-y-4 mb-8 reveal relative">
                <h3
                    class="text-xs font-bold uppercase tracking-widest text-blue-300 mb-3 border-b border-white/10 pb-1">
                    Contact Details</h3>
                <div id="contact-info-list" class="space-y-3"></div>
            </div>

            <!-- Creative Suite (was Software Suite) -->
            <div class="space-y-4 mb-8 reveal relative">
                <h3
                    class="text-xs font-bold uppercase tracking-widest text-blue-300 mb-3 border-b border-white/10 pb-1">
                    Creative Suite</h3>
                <div id="creative-suite-list" class="grid grid-cols-1 gap-2"></div>
            </div>

            <!-- Professional Focus -->
            <div class="space-y-4 mb-8 reveal relative">
                <h3
                    class="text-xs font-bold uppercase tracking-widest text-blue-300 mb-3 border-b border-white/10 pb-1">
                    Professional Focus</h3>
                <div id="professional-focus-list" class="space-y-3"></div>
            </div>

            <!-- Footer Section (Socials & Portfolio) -->
            <div class="mt-auto reveal relative">
                <!-- Social Media Links -->
                <div id="footer-socials"></div>

                <!-- 
                <h3
                    class="text-xs font-bold uppercase tracking-widest text-blue-300 mb-3 border-b border-white/10 pb-1">
                    Showcase</h3>
                <a href="Portfolio.html" class="portfolio-card block p-4 rounded-xl text-center cursor-pointer no-underline group">
                    <i class="fas fa-briefcase mb-2 text-xl block transition-transform group-hover:scale-125"></i>
                    <span class="text-[11px] font-bold uppercase tracking-widest">View Portfolio</span>
                    <p class="text-[9px] mt-1 opacity-60">Creative & Technical Projects</p>
                </a>
                 -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-10 bg-white">
            <!-- Summary -->
            <section class="mb-8 reveal relative">
                <h2 class="section-title text-sm">Professional Philosophy</h2>
                <div id="summary-content"></div>
            </section>

            <!-- Experience -->
            <section class="mb-8 relative">
                <div class="reveal">
                    <h2 class="section-title text-sm">Work Experience</h2>
                </div>
                <div id="experience-list" class="space-y-3"></div>
            </section>

            <!-- Contributions & Collaborative Projects -->
            <section class="mb-8 relative">
                <div class="reveal">
                    <h2 class="section-title text-sm">Collaborations & Projects</h2>
                </div>
                <div id="freelance-list" class="space-y-4"></div>
            </section>

            <!-- Education -->
            <section class="mb-8 relative">
                <div class="reveal">
                    <h2 class="section-title text-sm">Education</h2>
                </div>
                <div id="education-list" class="grid grid-cols-2 gap-4 reveal relative"></div>
            </section>

            <!-- Certifications -->
            <section class="reveal relative">
                <h2 class="section-title text-sm">Professional Certifications</h2>
                <div id="certifications-list" class="grid grid-cols-1 gap-2"></div>
            </section>
        </div>
    </div>

    <!-- UI Controls -->
    <div class="max-w-5xl mx-auto flex justify-center mt-6 no-print pb-12 gap-4">
        <button onclick="window.print()"
            class="group bg-blue-700 text-white font-bold px-10 py-4 rounded-full shadow-lg hover:bg-blue-800 hover:shadow-blue-500/40 transition-all flex items-center gap-3 transform hover:-translate-y-1">
            <i class="fas fa-print group-hover:animate-bounce"></i> Download CV (PDF)
        </button>
    </div>

    <!-- Modal for Editing (Same as used in CMS) -->
    <div id="editor-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 no-print"
        style="z-index: 9999;">
        <div
            class="bg-white rounded-2xl shadow-2xl w-full modal-content p-8 relative animate__animated animate__zoomIn">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h2 id="modal-title" class="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Edit Content</h2>
            <form id="editor-form" class="space-y-4">
                <div id="form-fields"></div>
                <div class="pt-6 flex justify-end gap-3 border-t">
                    <button type="button" id="cancel-edit"
                        class="px-6 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Cancel</button>
                    <button type="submit"
                        class="px-8 py-2 bg-blue-700 text-white rounded-lg hover:bg-blue-800 transition-all shadow-lg hover:shadow-blue-200">Save
                        Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
